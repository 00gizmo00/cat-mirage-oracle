<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4f7" />
    <title>にゃんこドロップ</title>
    <link rel="stylesheet" href="/nyanko-drop/styles.css?v=20260530-2" />
  </head>
  <body>
    <main class="game-shell" aria-label="にゃんこドロップ">
      <header class="game-header">
        <div class="title-block">
          <p class="eyebrow">Cat Match 3</p>
          <h1><span class="cat-face" aria-hidden="true">🐱</span>にゃんこドロップ</h1>
        </div>
        <div class="score-panel" aria-live="polite">
          <div>
            <span class="label">SCORE</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span class="label">CHAIN</span>
            <strong id="chain">0</strong>
          </div>
        </div>
      </header>

      <section class="board-wrap" aria-label="ゲーム盤面">
        <div class="board-deco top-left" aria-hidden="true">🐱</div>
        <div class="board-deco top-right" aria-hidden="true"></div>
        <div id="board" class="board" role="grid" aria-label="8かける8の猫パズル盤面"></div>
        <div class="paw-trail" aria-hidden="true">🐾　🐾　🐾</div>
        <div id="effectLayer" class="effect-layer" aria-hidden="true"></div>
        <div id="runner" class="cat-runner" aria-hidden="true">🐈‍⬛</div>
      </section>

      <p id="status" class="status" aria-live="polite">タップでもフリックでも動かせるよ</p>

      <footer class="actions">
        <button id="resetButton" type="button">リセット</button>
      </footer>
    </main>

    <script src="/nyanko-drop/game.js?v=20260530-2" defer></script>
  </body>
</html>
